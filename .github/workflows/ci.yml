name: CI

on:
  push:
    branches: ["main", "development", "feature/**"]
  pull_request:
    branches: ["main", "development"]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history/tags for semver parsing

      # 1. Pre-calculate SemVer Tag for build injection
      - name: Calculate SemVer Version
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      # 2. Add dev suffix if on feature/PR branches
      - name: Set Firmware Version env
        id: set_version
        run: |
          VERSION="${{ steps.tag_version.outputs.new_version }}"
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ github.event_name }}" != "push" ]; then
            VERSION="${VERSION}-dev.${{ github.run_number }}"
          fi
          echo "FIRMWARE_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GIT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%S)" >> $GITHUB_ENV
          echo "Calculated Version: ${VERSION}"


      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini')}}
          restore-keys: |
            ${{ runner.os }}-pio-
      
      - name: Install PlatformIO
        run: pip install platformio

      - name: Run native tests
        run: pio test -e native

      - name: Build ESP8266 firmware
        env:
          FIRMWARE_VERSION: ${{ env.FIRMWARE_VERSION }}
          GIT_COMMIT_HASH: ${{ env.GIT_COMMIT_HASH }}
          BUILD_TIMESTAMP: ${{ env.BUILD_TIMESTAMP }}
        run: pio run -e nodemcuv2-release

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-nodemcuv2-release
          path: .pio/build/nodemcuv2-release/firmware.bin
          if-no-files-found: error

      # --- Publishing and over-the-air (OTA) firmware upgrades ---

      # 4. Push official tag when merged to main
      - name: Create Git Tag
        id: create_tag
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create version file
        if:  github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "${{ steps.create_tag.outputs.new_version }}" > version.txt

      - name: Publish firmware to Github Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          name: Firmware ${{ steps.create_tag.outputs.new_tag }}
          body: ${{ steps.create_tag.outputs.changelog }}
          files: |
            .pio/build/nodemcuv2-release/firmware.bin
            version.txt